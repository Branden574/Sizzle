<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!--
  Sizzle email base skeleton — every template extends this shell.
  Source of truth: Board 01 "Sizzle Email Reset.dc.html" + SPEC.md §3.
  Replaceable regions are marked with  template:<name>  comments:
    template:title        — <title> text (matches the subject line)
    template:preheader    — hidden preview text, ~80 chars, DISTINCT per template
    template:category     — header bookend right-side mono tag (text + color per template)
    template:hairline     — 3px hairline. Default: flame gradient, flat #FF5320 bgcolor
                            fallback. Gold family: linear-gradient(90deg,#FFD23A,#FF8A2C,#FFD23A)
                            flat #FF8A2C. Policy (content-removed): solid #3A322B, no gradient.
                            Animated-GIF upgrade slot: replace the td's content with
                            <img src="https://getsizzle.app/email/hairline-flame.gif" width="600" height="3" alt="">
                            (GIF 1200x6 @2x, <=35 KB) — static CSS gradient is the sanctioned fallback.
    template:body         — the template's content rows (td.sz-body carries pad 44 / mobile 30-22)
    template:footer-links — footer link row (Help Center / Privacy / Terms / Support + extras)
    template:why          — the "why you got this" line — ALWAYS present
  Variables used by the shell itself:
    {{page_bg}}   — #F5EFE6 adaptive templates / #050404 dark-native templates
    {{help_url}} {{privacy_url}} {{terms_url}} {{support_url}} {{appstore_url}} {{play_url}}
  All spacing is CELL PADDING. role="presentation" on every layout table. No JavaScript.
-->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="supported-color-schemes" content="light dark" />
<meta name="x-apple-disable-message-reformatting" />
<!-- template:title -->
<title>Sizzle</title>
<!-- /template:title -->
<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<style type="text/css">
table {border-collapse:collapse;}
td, p, a, span, div {font-family:Helvetica, Arial, sans-serif;}
.sz-serif {font-family:Georgia, serif !important;}
.sz-mono {font-family:Consolas, monospace !important;}
</style>
<![endif]-->
<!--[if !mso]><!-->
<style type="text/css">
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap');
</style>
<!--<![endif]-->
<style type="text/css">
html, body {margin:0 !important; padding:0 !important; width:100% !important;}
* {-ms-text-size-adjust:100%; -webkit-text-size-adjust:100%;}
table, td {mso-table-lspace:0pt; mso-table-rspace:0pt;}
img {-ms-interpolation-mode:bicubic; border:0; outline:none; text-decoration:none;}
a {text-decoration:none;}
div[style*="margin: 16px 0"] {margin:0 !important;}
/* ===== single-column stacking at <=480px (mobile comps at 375) ===== */
@media only screen and (max-width:480px) {
  .sz-gutter {padding:24px 20px 32px !important;}
  .sz-card {border-radius:20px !important;}
  .sz-header {padding:16px 22px !important; border-radius:20px 20px 0 0 !important;}
  .sz-hd-mark {width:20px !important; height:25px !important;}
  .sz-hd-word {font-size:18px !important;}
  .sz-hd-tag {font-size:9px !important; letter-spacing:.16em !important;}
  .sz-body {padding:30px 22px 28px !important;}
  .sz-eyebrow {font-size:10.5px !important;}
  .sz-h1 {font-size:28px !important; line-height:1.16 !important;}
  .sz-copy {font-size:14.5px !important; line-height:1.6 !important;}
  .sz-cta {max-width:100% !important;}
  .sz-card-inner {padding:18px !important; border-radius:14px !important;}
  .sz-card-label {font-size:9.5px !important;}
  .sz-label-col {width:76px !important;}
  .sz-grid-txt {font-size:13px !important;}
  .sz-stack {display:block !important; width:100% !important;}
  .sz-footer {padding:20px 22px 24px !important; border-radius:0 0 20px 20px !important;}
  .sz-ft-stack {display:block !important; width:100% !important; text-align:center !important;}
  .sz-ft-links {padding-top:12px !important;}
  .sz-ft-mark {width:13px !important; height:16px !important;}
  .sz-ft-word {font-size:15px !important;}
  .sz-ft-tbl {float:none !important; margin:0 auto !important;}
  .sz-legal {font-size:11px !important;}
}
/* ===== dark mode — bookends stay #0C0A09 in BOTH modes ===== */
@media (prefers-color-scheme: dark) {
  body, .sz-page {background-color:#050404 !important;}
  .sz-card {box-shadow:0 24px 60px -30px rgba(255,83,32,.16) !important;}
  .sz-body {background-color:#14100D !important;}
  .sz-ink {color:#F5EFE6 !important;}
  .sz-copy {color:#B3A698 !important;}
  .sz-strong {color:#F5EFE6 !important;}
  .sz-sunken {background-color:#1D1712 !important; border-color:rgba(255,255,255,.07) !important;}
  .sz-divider {border-top-color:rgba(255,255,255,.07) !important;}
  .sz-value {color:#F5EFE6 !important;}
  .sz-cta {box-shadow:0 10px 30px -10px rgba(255,83,32,.5) !important;}
  /* per-family accents (templates add their own): */
  .sz-eyebrow-violet {color:#9D7FE0 !important;}
  .sz-outline-violet {color:#B79BF0 !important; border-color:rgba(157,127,224,.6) !important;}
  .sz-mono-url {background-color:#1D1712 !important; border-color:rgba(255,255,255,.07) !important; color:#B79BF0 !important;}
  .sz-support {color:#FF7A4A !important;}
  .sz-expiry-strong {color:#B3A698 !important;}
  .sz-gold-surface {color:#FFD23A !important;}
  .sz-solid-btn {background-color:#F5EFE6 !important; color:#1B1512 !important;}
}
</style>
</head>
<body class="sz-page" style="margin:0; padding:0; width:100%; background-color:{{page_bg}};">
<!-- template:preheader — hidden preview text, distinct per template, padded with zwnj/nbsp -->
<span style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">{{preheader}}&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;</span>
<!-- /template:preheader -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="{{page_bg}}" class="sz-page" style="width:100%; background-color:{{page_bg}};">
  <tr>
    <td align="center" class="sz-gutter" style="padding:36px 20px 44px;">
      <!--[if mso]>
      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" align="center"><tr><td>
      <![endif]-->
      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" align="center" class="sz-card" style="width:100%; max-width:600px; border-radius:24px; box-shadow:0 24px 60px -30px rgba(27,21,18,.3); font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;">

        <!-- ============ HEADER BOOKEND — #0C0A09 both modes, never changes ============ -->
        <tr>
          <td bgcolor="#0C0A09" class="sz-header" style="background-color:#0C0A09; padding:18px 32px; border-radius:24px 24px 0 0;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td align="left" valign="middle">
                  <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                    <tr>
                      <td valign="middle" style="padding-right:10px;">
                        <img src="https://getsizzle.app/email/sizzle-mark-flat-512.png" width="22" height="28" alt="Sizzle" class="sz-hd-mark" style="display:block; width:22px; height:28px;" />
                      </td>
                      <td valign="middle" class="sz-serif sz-hd-word" style="font-family:'Instrument Serif',Georgia,serif; font-size:20px; line-height:1; color:#FFFFFF;">Sizzle</td>
                    </tr>
                  </table>
                </td>
                <!-- template:category — mono tag text + color per template (e.g. ACCOUNT SECURITY #8A7C70, MILESTONE #FFD23A) -->
                <td align="right" valign="middle" class="sz-mono sz-hd-tag" style="font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10px; letter-spacing:.18em; color:#8A7C70;">{{category_label}}</td>
                <!-- /template:category -->
              </tr>
            </table>
          </td>
        </tr>

        <!-- ============ HAIRLINE — 3px, family gradient, flat bgcolor fallback for Outlook ============ -->
        <!-- template:hairline -->
        <tr>
          <td bgcolor="#FF5320" height="3" style="height:3px; line-height:3px; font-size:0; background-color:#FF5320; background-image:linear-gradient(90deg,#FFD23A,#FF7A2A,#FF5320,#E02F80,#8A1C66);">&nbsp;</td>
        </tr>
        <!-- /template:hairline -->

        <!-- ============ BODY CARD — #FFFFFF -> dark #14100D ============ -->
        <!-- template:body — replace this entire row's inner content; keep td.sz-body -->
        <tr>
          <td bgcolor="#FFFFFF" align="center" class="sz-body" style="background-color:#FFFFFF; padding:44px 44px 40px;">
            {{body}}
          </td>
        </tr>
        <!-- /template:body -->

        <!-- ============ FOOTER BOOKEND — identical in light and dark ============ -->
        <tr>
          <td bgcolor="#0C0A09" class="sz-footer" style="background-color:#0C0A09; padding:26px 32px 28px; border-radius:0 0 24px 24px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td align="left" valign="middle" class="sz-ft-stack">
                  <table role="presentation" border="0" cellpadding="0" cellspacing="0" class="sz-ft-tbl">
                    <tr>
                      <td valign="middle" style="padding-right:9px;">
                        <img src="https://getsizzle.app/email/sizzle-mark-white-512.png" width="15" height="19" alt="" class="sz-ft-mark" style="display:block; width:15px; height:19px; opacity:.9;" />
                      </td>
                      <td valign="middle" class="sz-serif sz-ft-word" style="font-family:'Instrument Serif',Georgia,serif; font-size:16px; line-height:1; color:#F5EFE6;">Sizzle</td>
                    </tr>
                  </table>
                </td>
                <!-- template:footer-links — per-template extras go here (Notification settings, Unsubscribe, ...) -->
                <td align="right" valign="middle" class="sz-ft-stack sz-ft-links" style="font-size:12.5px;">
                  <a href="{{help_url}}" style="color:#B3A698; text-decoration:none;">Help Center</a>&nbsp;&nbsp;&nbsp;<a href="{{privacy_url}}" style="color:#B3A698; text-decoration:none;">Privacy</a>&nbsp;&nbsp;&nbsp;<a href="{{terms_url}}" style="color:#B3A698; text-decoration:none;">Terms</a>&nbsp;&nbsp;&nbsp;<a href="{{support_url}}" style="color:#B3A698; text-decoration:none;">Support</a>
                </td>
                <!-- /template:footer-links -->
              </tr>
            </table>
            <!-- store badges — bordered TEXT, never images (official artwork swap is a production decision) -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" class="sz-ft-tbl">
              <tr>
                <td style="padding-top:18px;">
                  <a href="{{appstore_url}}" style="text-decoration:none; display:inline-block;">
                    <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="border:1px solid rgba(255,255,255,.22); border-radius:9px; padding:7px 14px;">
                          <div class="sz-mono" style="font-family:ui-monospace,Menlo,Consolas,monospace; font-size:8.5px; letter-spacing:.1em; color:#8A7C70;">DOWNLOAD ON THE</div>
                          <div style="font-size:13px; font-weight:700; color:#F5EFE6; margin:1px 0 0;">App Store</div>
                        </td>
                      </tr>
                    </table>
                  </a>
                </td>
                <td style="padding-top:18px; padding-left:10px;">
                  <a href="{{play_url}}" style="text-decoration:none; display:inline-block;">
                    <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="border:1px solid rgba(255,255,255,.22); border-radius:9px; padding:7px 14px;">
                          <div class="sz-mono" style="font-family:ui-monospace,Menlo,Consolas,monospace; font-size:8.5px; letter-spacing:.1em; color:#8A7C70;">GET IT ON</div>
                          <div style="font-size:13px; font-weight:700; color:#F5EFE6; margin:1px 0 0;">Google Play</div>
                        </td>
                      </tr>
                    </table>
                  </a>
                </td>
              </tr>
            </table>
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td class="sz-ft-stack" style="padding-top:20px;">
                  <!-- template:why — the "why you got this" line, ALWAYS present. Security emails: no unsubscribe. -->
                  <p class="sz-legal" style="margin:0; font-size:11.5px; line-height:1.7; color:#6C5F56;">{{why_line}}<br />Sizzle Inc &middot; 1550 Vine Street, Los Angeles, CA 90028 &middot; &copy; 2026 Sizzle Inc.</p>
                  <!-- /template:why -->
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
      <!--[if mso]>
      </td></tr></table>
      <![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
