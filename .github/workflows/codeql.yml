# CodeQL SAST — free on public repos. Scans JS/TS for injection, path traversal,
# unsafe deserialization, prototype pollution, etc. Alerts land in the repo's
# Security tab; the weekly security sweep reads them via `gh api`.
name: CodeQL

on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', '.github/workflows/codeql.yml']
  pull_request:
    branches: [main]
    paths: ['apps/**', 'packages/**']
  schedule:
    - cron: '23 10 * * 2' # weekly, Tuesday 10:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Native vendored iOS/Android build products aren't our attack surface.
          config: |
            paths-ignore:
              - apps/web/ios
              - apps/web/android
              - '**/dist'
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
