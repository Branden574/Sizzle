<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0b09" />
    <meta
      name="description"
      content="Sizzle — watch it, then cook it. A full-screen video feed of real recipes from real home cooks. Swipe, save, cook."
    />
    <title>Sizzle</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getsizzle.app" />
    <meta property="og:title" content="Sizzle — watch it, then cook it" />
    <meta property="og:description" content="A full-screen video feed of real recipes from real home cooks. Swipe, save, cook." />
    <meta property="og:image" content="https://getsizzle.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sizzle — watch it, then cook it" />
    <meta name="twitter:description" content="A full-screen video feed of real recipes from real home cooks. Swipe, save, cook." />
    <meta name="twitter:image" content="https://getsizzle.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: the first paint before React mounts. React clears #root
           on render, so this is replaced automatically. CSS vars aren't loaded
           yet, so the inline script below picks the light/dark bg from the saved
           theme so the very first frame matches the user's choice. -->
      <div id="sz-boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e0c0b">
        <div style="font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-size:48px;line-height:1;background-image:linear-gradient(135deg,#ff5a1f,#f4a52c);-webkit-background-clip:text;background-clip:text;color:transparent">Sizzle</div>
        <div style="width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(150,140,130,.2);border-top-color:#ff5a1f;animation:sz-boot-spin .8s linear infinite"></div>
      </div>
    </div>
    <style>@keyframes sz-boot-spin{to{transform:rotate(360deg)}}</style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sz-prefs');
          var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.getElementById('sz-boot');
          if (el) el.style.background = dark ? '#0e0c0b' : '#faf3ea';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
